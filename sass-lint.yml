options:
  formatter: stylish
files:
  include: "web/assets/scss/**/*.s+(a|c)ss"
rules:
  no-css-comments: 0
  no-vendor-prefixes: 0
  class-name-format: 0
  force-element-nesting: 0
  force-pseudo-nesting: 0
  force-attribute-nesting: 0
  no-color-literals: 0
  no-color-keywords: 0
  property-sort-order: 0
  nesting-depth: 0
  no-qualifying-elements: 0
  no-important: 0
  mixins-before-declarations: 0
  no-transition-all: 0
  leading-zero: 0
  hex-length: 0
  hex-notation: 0
  indentation: 0
  no-mergeable-selectors: 0
  pseudo-element: 0
  single-line-per-selector: 0
  space-after-comma: 0
  no-duplicate-properties: 0
  shorthand-values: 0
  zero-unit: 0
  url-quotes: 0
  quotes: 0
  placeholder-in-extend: 0
  variable-name-format: 0
  mixin-name-format: 0
  function-name-format: 0
  empty-line-between-blocks: 0
  clean-import-paths: 0
  no-ids: 0
  id-name-format: 0
  max-file-line-count: 0
  no-url-domains: 0
  no-url-protocols: 0
